<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ijiock — 自動盯盤 · 投資顧問</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;600;700;900&family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ── Token: Colors ───────────────────────────────────────── */
:root {
  --up: #ef4444; --up-soft: rgba(239,68,68,.10); --up-tone: #EF5350;
  --dn: #22c55e; --dn-soft: rgba(34,197,94,.10);  --dn-tone: #26A69A;
  --warn: #f59e0b; --warn-soft: rgba(245,158,11,.10);
  --accent: #2563eb; --accent-soft: rgba(37,99,235,.10);
  --accent-2: #3b82f6; --accent-3: #60a5fa;
  --text: #18181b; --text-2: #3f3f46; --text-3: #71717a;
  --surface: rgba(255,255,255,.35); --surface-2: rgba(255,255,255,.20); --surface-3: rgba(255,255,255,.10);
  --border: rgba(0,0,0,.06); --border-md: rgba(0,0,0,.12);
  --page-bg: #eef0f3;
  --page-gradient:
    radial-gradient(45% 36% at 0% 0%,   rgba(255,150,80,.32)  0%, transparent 70%),
    radial-gradient(42% 36% at 100% 0%, rgba(0,113,227,.26)   0%, transparent 70%),
    radial-gradient(50% 42% at 0% 100%,  rgba(184,48,37,.22)  0%, transparent 70%),
    radial-gradient(45% 38% at 100% 100%,rgba(46,107,127,.26) 0%, transparent 70%),
    radial-gradient(40% 35% at 50% 100%, rgba(246,171,0,.14)  0%, transparent 75%);
  --card-fill: rgba(255,255,255,.66);
  --card-blur: blur(28px) saturate(180%);
  --card-border: 0.5px solid rgba(255,255,255,.55);
  --card-highlight: inset 0 1px 0 rgba(255,255,255,.70), inset 0 -0.5px 0 rgba(0,0,0,.03);
  --card-shadow: 0 1px 3px rgba(0,0,0,.04), 0 12px 32px rgba(0,0,0,.05);
  --card-shadow-hover: 0 2px 6px rgba(0,0,0,.05), 0 20px 48px rgba(0,0,0,.09);
  --font-sans: 'Outfit','Noto Sans TC',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --font-mono: 'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --radius-card: 20px; --radius-tile: 13px;
  --ease-back: cubic-bezier(.34,1.56,.64,1); --ease-out: cubic-bezier(.16,1,.3,1);
}
:root[data-appearance="dark"], [data-appearance="dark"], .dark {
  --surface: rgba(44,44,46,.35); --surface-2: rgba(58,58,60,.20); --surface-3: rgba(72,72,74,.10);
  --text: #ffffff; --text-2: #a1a1aa; --text-3: #71717a;
  --accent: #3b82f6; --accent-soft: rgba(59,130,246,.20);
  --up: #f87171; --up-soft: rgba(248,113,113,.15);
  --dn: #4ade80; --dn-soft: rgba(74,222,128,.15);
  --border: rgba(255,255,255,.08); --border-md: rgba(255,255,255,.15);
  --page-bg: #141417;
  --page-gradient:
    radial-gradient(45% 36% at 0% 0%,   rgba(255,120,60,.16) 0%, transparent 72%),
    radial-gradient(42% 36% at 100% 0%, rgba(10,132,255,.15) 0%, transparent 72%),
    radial-gradient(50% 42% at 0% 100%,  rgba(255,69,58,.10) 0%, transparent 72%),
    radial-gradient(45% 38% at 100% 100%,rgba(100,210,255,.11) 0%, transparent 72%),
    radial-gradient(40% 35% at 50% 100%, rgba(255,214,10,.07) 0%, transparent 78%);
  --card-fill: rgba(44,44,50,.74);
  --card-border: 0.5px solid rgba(255,255,255,.09);
  --card-highlight: inset 0 1px 0 rgba(255,255,255,.06), inset 0 -0.5px 0 rgba(0,0,0,.18);
  --card-shadow: 0 1px 3px rgba(0,0,0,.18), 0 12px 32px rgba(0,0,0,.28);
  --card-shadow-hover: 0 2px 6px rgba(0,0,0,.26), 0 20px 48px rgba(0,0,0,.40);
}

/* ── Reset + base ────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: var(--font-sans); font-size: 13px;
  background: var(--page-bg); background-image: var(--page-gradient);
  background-attachment: fixed; color: var(--text);
  -webkit-font-smoothing: antialiased;
}
button, input, textarea, select { font-family: inherit; }

/* ── Glass card ──────────────────────────────────────────── */
.glass-card {
  background: var(--card-fill);
  backdrop-filter: var(--card-blur); -webkit-backdrop-filter: var(--card-blur);
  border: var(--card-border); border-radius: 20px;
  box-shadow: var(--card-highlight), var(--card-shadow);
}

/* ── App Layout ──────────────────────────────────────────── */
.app { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
.main-layout { display: flex; flex: 1; overflow: hidden; padding: 8px 12px 12px; gap: 10px; min-height: 0; }

/* ── NavBar ──────────────────────────────────────────────── */
.navbar-wrapper { padding: 10px 12px 0; flex-shrink: 0; display: flex; justify-content: center; z-index: 100; }
.navbar {
  display: flex; align-items: center; gap: 10px; padding: 8px 20px;
  background: var(--card-fill); backdrop-filter: var(--card-blur); -webkit-backdrop-filter: var(--card-blur);
  border: var(--card-border); border-radius: 99px;
  box-shadow: var(--card-highlight), var(--card-shadow);
  width: 100%; max-width: 1600px;
}
.logo { display: flex; align-items: center; gap: 8px; user-select: none; flex-shrink: 0; }
.logo-mark { width: 28px; height: 28px; border-radius: 8px; background: linear-gradient(135deg,#1d1d1f,#3a3a3c); display: flex; align-items: center; justify-content: center; }
.logo-mark svg { width: 15px; height: 15px; stroke: #fff; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.logo-txt { font-size: 15px; font-weight: 800; letter-spacing: -.4px; line-height: 1.1; }
.logo-sub { font-size: 9px; font-weight: 600; color: var(--text-3); margin-top: -1px; }
.live-badge { display: flex; align-items: center; gap: 4px; font-size: 10px; font-weight: 700; color: var(--dn); background: var(--dn-soft); padding: 2px 8px; border-radius: 20px; flex-shrink: 0; }
.live-dot { width: 5px; height: 5px; background: var(--dn); border-radius: 50%; animation: blink 2s infinite; }
@keyframes blink { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.3;transform:scale(.7)} }
.session-clock { display: flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 20px; background: var(--surface-2); border: 1px solid var(--border-md); flex-shrink: 0; }
.session-item { display: flex; align-items: center; gap: 4px; }
.session-dot { width: 6px; height: 6px; border-radius: 50%; animation: spulse 2.5s ease-in-out infinite; }
@keyframes spulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.5;transform:scale(.75)} }
.session-label { font-size: 9px; font-weight: 800; color: var(--text-3); letter-spacing:.4px; }
.session-status { font-size: 10px; font-weight: 700; }
.session-divider { width: 1px; height: 14px; background: var(--border-md); }
.session-time { font-size: 10px; color: var(--text-3); font-family: var(--font-mono); }
.nav-right { margin-left: auto; display: flex; gap: 4px; align-items: center; }
.ibtn { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; border: none; border-radius: 8px; background: var(--surface-2); color: var(--text-2); cursor: pointer; font-size: 13px; transition: all .18s; flex-shrink: 0; }
.ibtn:hover { background: var(--surface); color: var(--text); transform: translateY(-1px); }

/* ── Market Ticker ───────────────────────────────────────── */
.market-ticker { height: 26px; overflow: hidden; flex-shrink: 0; display: flex; align-items: center; margin: 6px 12px 0; background: var(--surface-2); border: var(--card-border); border-radius: 10px; }
.ticker-track { display: flex; align-items: center; white-space: nowrap; animation: tscroll 42s linear infinite; }
.market-ticker:hover .ticker-track { animation-play-state: paused; }
@keyframes tscroll { 0%{transform:translateX(0)} 100%{transform:translateX(-50%)} }
.ticker-item { display: inline-flex; align-items: center; gap: 4px; padding: 0 12px; font-size: 10.5px; }
.ticker-label { color: var(--text-3); font-weight: 600; font-size: 10px; }
.ticker-price { font-size: 11px; font-weight: 700; font-family: var(--font-mono); }
.ticker-chg { font-size: 10px; font-weight: 600; }
.ticker-sep { color: var(--border-md); padding-left: 8px; }

/* ── WatchList ───────────────────────────────────────────── */
.watchlist { width: 278px; flex-shrink: 0; display: flex; flex-direction: column; overflow: hidden; }
.wl-header { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px 6px; flex-shrink: 0; }
.wl-title { font-size: 10px; font-weight: 700; color: var(--text-3); letter-spacing:.6px; text-transform: uppercase; }
.ibtn-sm { width: 22px; height: 22px; border: none; border-radius: 6px; background: var(--surface-2); color: var(--text-2); cursor: pointer; font-size: 12px; display: flex; align-items: center; justify-content: center; line-height: 1; transition: all .15s; }
.ibtn-sm:hover { background: var(--surface); color: var(--text); }
.ibtn-sm.active-sm { background: var(--accent-soft); color: var(--accent); }
.wl-search-wrap { position: relative; padding: 0 8px 6px; flex-shrink: 0; }
.wl-search { width: 100%; padding: 6px 24px 6px 12px; border: var(--card-border); border-radius: 20px; background: var(--surface-2); color: var(--text); font-size: 11px; transition: all .2s; outline: none; }
.wl-search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); background: var(--surface); }
.wl-search::placeholder { color: var(--text-3); }
.wl-search-clear { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-3); cursor: pointer; font-size: 10px; margin-top: -3px; }
.cat-tabs { display: flex; gap: 3px; padding: 0 8px 6px; flex-wrap: wrap; flex-shrink: 0; }
.cat-tab { padding: 4px 9px; border: 1.5px solid var(--border-md); border-radius: 20px; font-size: 10.5px; font-weight: 600; background: transparent; color: var(--text-2); cursor: pointer; transition: all .15s; }
.cat-tab:hover { background: var(--surface-2); }
.cat-tab.active { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.mkt-breadth { padding: 2px 10px 6px; flex-shrink: 0; }
.mkt-breadth-bar { height: 4px; border-radius: 4px; background: var(--dn-soft); overflow: hidden; margin-bottom: 4px; }
.mkt-breadth-fill { height: 100%; background: var(--up); border-radius: 4px; transition: width .6s; }
.mkt-breadth-labels { display: flex; align-items: center; justify-content: space-between; font-size: 9px; font-weight: 700; }
.fg-row { display: flex; align-items: center; gap: 4px; flex: 1; margin: 0 8px; }
.fg-track { flex: 1; height: 3px; background: var(--surface-3); border-radius: 2px; }
.fg-fill { height: 100%; border-radius: 2px; transition: width .3s; }
.fg-label { font-size: 8px; font-weight: 800; flex-shrink: 0; }
.fg-score { font-size: 9px; font-weight: 900; flex-shrink: 0; font-family: var(--font-mono); }
.wl-list { flex: 1; overflow-y: auto; padding: 0 6px 8px; list-style: none; }
.wl-list.scroll-soft { mask-image: linear-gradient(to bottom, transparent 0, black 14px, black calc(100% - 14px), transparent 100%); -webkit-mask-image: linear-gradient(to bottom, transparent 0, black 14px, black calc(100% - 14px), transparent 100%); }
.wl-item { display: flex; align-items: center; padding: 6px 8px; border-radius: 10px; cursor: pointer; transition: all .18s; gap: 5px; min-height: 46px; }
.wl-item:hover { background: var(--surface-2); transform: translateX(2px); }
.wl-item.active { background: var(--accent-soft); }
.wl-left { flex: 1; min-width: 0; }
.wl-name-row { display: flex; align-items: center; gap: 4px; }
.wl-name { font-size: 12px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wl-symbol { font-size: 9.5px; color: var(--text-3); font-family: var(--font-mono); }
.wl-right { text-align: right; flex-shrink: 0; }
.wl-price { font-size: 12px; font-weight: 700; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.wl-chg { font-size: 10px; font-weight: 600; font-family: var(--font-mono); }
.wl-mover-badge { font-size: 7px; font-weight: 900; padding: 1px 4px; border-radius: 3px; letter-spacing:.5px; flex-shrink: 0; }
.wl-table-wrap { flex: 1; overflow-y: auto; }
.wl-table { width: 100%; border-collapse: collapse; font-size: 10.5px; }
.wl-table thead th { position: sticky; top: 0; background: var(--surface-2); padding: 5px 6px; font-size: 9px; font-weight: 800; color: var(--text-3); text-align: right; border-bottom: 1px solid var(--border); letter-spacing:.4px; text-transform: uppercase; }
.wl-table thead th:first-child { text-align: left; padding-left: 10px; }
.wl-trow { cursor: pointer; border-bottom: 1px solid rgba(0,0,0,.04); transition: background .12s; }
.wl-trow:hover { background: var(--surface-2); }
.wl-trow.active { background: var(--accent-soft); }
.wl-trow td { padding: 6px; vertical-align: middle; text-align: right; }
.wl-trow td:first-child { text-align: left; padding-left: 10px; }
.wl-tname { font-weight: 700; }
.wl-tsym { font-size: 9px; color: var(--text-3); font-family: var(--font-mono); }
.wl-heatmap { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 6px 8px; overflow-y: auto; align-content: start; }
.heat-cell { padding: 7px 5px; border-radius: 8px; cursor: pointer; transition: all .18s; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.heat-cell:hover { transform: scale(1.04); }
.heat-name { font-size: 10px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; width: 100%; }
.heat-pct { font-size: 12px; font-weight: 800; font-family: var(--font-mono); }

/* ── Center ──────────────────────────────────────────────── */
.center-col { flex: 1; display: flex; flex-direction: column; gap: 10px; min-width: 0; overflow: hidden; }

/* ── Chart Panel ─────────────────────────────────────────── */
.chart-panel { display: flex; flex-direction: column; flex: 1; min-height: 0; overflow: hidden; }
.chart-header { display: flex; align-items: center; gap: 8px; padding: 10px 14px 8px; border-bottom: 1px solid var(--border); flex-shrink: 0; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
.chart-header::-webkit-scrollbar { display: none; }
.chart-name-block { display: flex; align-items: center; gap: 7px; flex-shrink: 0; }
.chart-title { font-size: 15px; font-weight: 800; letter-spacing: -.3px; }
.chart-sym { font-size: 11px; color: var(--text-3); }
.chart-price-pill { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 20px; font-family: var(--font-mono); flex-shrink: 0; }
.interval-tabs { display: flex; gap: 2px; background: var(--accent-soft); border-radius: 7px; padding: 3px; flex-shrink: 0; }
.interval-tabs .itab { padding: 3px 10px; border-radius: 5px; font-size: 11px; font-weight: 700; color: var(--text-2); background: transparent; border: none; cursor: pointer; transition: all .15s; }
.interval-tabs .itab.active { background: var(--accent); color: #fff; }
.range-tabs { display: flex; gap: 4px; flex-shrink: 0; }
.range-tab { padding: 3px 9px; border: 1.5px solid var(--border-md); border-radius: 5px; font-size: 11px; font-weight: 700; background: transparent; color: var(--text-2); cursor: pointer; transition: all .15s; }
.range-tab.active { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.chart-ohlc-bar { display: flex; align-items: center; padding: 4px 14px; background: var(--surface-2); border-bottom: 1px solid var(--border); flex-shrink: 0; overflow-x: auto; scrollbar-width: none; }
.chart-ohlc-bar::-webkit-scrollbar { display: none; }
.ohlc-item { display: flex; align-items: center; gap: 4px; padding: 2px 10px; border-right: 1px solid var(--border); white-space: nowrap; }
.ohlc-item:last-child { border-right: none; }
.ohlc-k { font-size: 9px; font-weight: 700; color: var(--text-3); letter-spacing:.4px; }
.ohlc-v { font-size: 11px; font-weight: 600; font-family: var(--font-mono); }
.chart-area { flex: 1; min-height: 0; position: relative; overflow: hidden; }

/* ── Tech Signals ────────────────────────────────────────── */
.tech-panel { display: flex; flex-direction: column; flex-shrink: 0; padding: 10px 12px 12px; overflow-y: auto; max-height: 340px; }
.tech-top-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
.trend-badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 800; padding: 4px 12px; border-radius: 20px; flex-shrink: 0; }
.composite-score { flex: 1; display: flex; align-items: center; gap: 8px; background: var(--surface-2); border-radius: 8px; padding: 5px 10px; min-width: 180px; }
.cs-left { flex-shrink: 0; }
.cs-label { font-size: 9px; font-weight: 700; color: var(--text-3); text-transform: uppercase; letter-spacing:.5px; }
.cs-value { font-size: 11px; font-weight: 800; margin-top: 1px; }
.cs-bar-wrap { flex: 1; }
.cs-bar-track { height: 6px; border-radius: 6px; background: var(--border-md); position: relative; overflow: visible; }
.cs-bar-fill { height: 100%; border-radius: 6px; transition: width .5s; }
.cs-needle { position: absolute; top: -3px; width: 2px; height: 12px; background: var(--text); border-radius: 2px; transform: translateX(-50%); transition: left .5s; box-shadow: 0 0 4px rgba(0,0,0,.3); }
.cs-ticks { display: flex; justify-content: space-between; font-size: 8px; color: var(--text-3); margin-top: 3px; }
.cs-score { font-size: 13px; font-weight: 900; flex-shrink: 0; font-family: var(--font-mono); }
/* BB banner */
.bb-banner { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 10px; margin-bottom: 10px; border: 1.5px solid transparent; animation: bb-banner-in .25s ease; }
@keyframes bb-banner-in { from { opacity:0; transform:translateY(-4px); } to { opacity:1; transform:translateY(0); } }
.bb-banner-bull { background: var(--up-soft); border-color: var(--up); }
.bb-banner-bear { background: var(--dn-soft); border-color: var(--dn); }
.bb-banner-squeeze { background: rgba(245,158,11,.1); border-color: var(--warn); }
.bb-banner-neutral { background: var(--surface-2); border-color: var(--border-md); }
.bb-banner-icon { font-size: 22px; font-weight: 900; flex-shrink: 0; line-height: 1; }
.bb-banner-body { flex: 1; min-width: 0; }
.bb-banner-title { font-size: 9px; font-weight: 700; color: var(--text-3); text-transform: uppercase; letter-spacing:.6px; }
.bb-banner-sig { font-size: 12px; font-weight: 800; color: var(--text); margin-top: 1px; }
.bb-banner-hint { font-size: 9.5px; font-weight: 600; color: var(--text-2); margin-top: 2px; opacity:.85; }
.bb-banner-right { flex-shrink: 0; min-width: 80px; text-align: right; }
.bb-banner-width-label { font-size: 8px; color: var(--text-3); font-weight: 700; letter-spacing:.5px; }
.bb-banner-width-val { font-size: 16px; font-weight: 900; font-family: var(--font-mono); line-height: 1.1; }
.bb-bw-track { position: relative; height: 4px; background: var(--border-md); border-radius: 4px; margin-top: 4px; overflow: visible; }
.bb-bw-fill { height: 100%; border-radius: 4px; transition: width .4s; }
.bb-bw-mark { position: absolute; top: -2px; width: 1.5px; height: 8px; background: var(--warn); border-radius: 2px; }
/* tech grid */
.tech-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.sig-card { display: flex; flex-direction: column; gap: 6px; padding: 10px 11px; background: var(--surface-2); border-radius: 10px; border-left: 3px solid transparent; transition: all .2s; }
.sig-card:hover { transform: translateY(-2px); }
.sig-card.bull { border-left-color: var(--up); background: var(--up-soft); }
.sig-card.bear { border-left-color: var(--dn); background: var(--dn-soft); }
.sig-card.neutral { border-left-color: var(--text-3); }
.sig-top { display: flex; align-items: flex-start; gap: 7px; }
.sig-geo { width: 28px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 900; flex-shrink: 0; }
.sig-geo.bull { background: var(--up-soft); color: var(--up); }
.sig-geo.bear { background: var(--dn-soft); color: var(--dn); }
.sig-geo.neutral { background: var(--surface-3); color: var(--text-3); }
.sig-body { flex: 1; min-width: 0; }
.tech-label { font-size: 9px; font-weight: 700; color: var(--text-3); text-transform: uppercase; letter-spacing:.4px; }
.tech-sig { font-size: 11px; font-weight: 700; margin-top: 2px; line-height: 1.3; }
.sig-bars { display: flex; flex-direction: column; gap: 4px; }
.bar-row { display: flex; align-items: center; gap: 5px; }
.bar-lbl { font-size: 9px; font-weight: 700; color: var(--text-3); width: 24px; flex-shrink: 0; text-transform: uppercase; }
.prog-track { flex: 1; height: 4px; background: var(--border-md); border-radius: 4px; overflow: hidden; }
.prog-fill { height: 100%; border-radius: 4px; transition: width .4s; }
.bar-val { font-size: 10px; font-weight: 600; color: var(--text-2); flex-shrink: 0; font-family: var(--font-mono); }
/* macd bar */
.macd-track { flex: 1; height: 4px; background: var(--border-md); border-radius: 4px; position: relative; overflow: hidden; }
.macd-mid { position: absolute; left: 50%; top: 0; width: 1px; height: 100%; background: var(--text-3); transform: translateX(-50%); }
.macd-bar { position: absolute; top: 0; height: 100%; border-radius: 2px; transition: all .4s; }
/* rsi gauge */
.rsi-gauge-wrap { display: flex; flex-direction: column; align-items: center; gap: 0; }

/* atr gauge */

.atr-track { height: 8px; border-radius: 6px; background: var(--border-md); position: relative; overflow: hidden; }
.atr-fill { height: 100%; border-radius: 6px; transition: width .4s; }
.atr-zone-lo { position: absolute; left: 30%; top: 0; width: 1px; height: 100%; background: rgba(255,255,255,.3); }
.atr-zone-hi { position: absolute; left: 60%; top: 0; width: 1px; height: 100%; background: rgba(255,255,255,.3); }
.atr-labels { display: flex; justify-content: space-between; font-size: 8px; color: var(--text-3); }
.atr-val { font-size: 11px; font-weight: 800; text-align: center; }
/* cci track */
.cci-track { flex: 1; height: 6px; background: var(--surface-3); border-radius: 3px; position: relative; overflow: visible; }
.cci-zone-lo { position: absolute; left: 0; width: 33.33%; height: 100%; background: rgba(38,166,154,.15); border-radius: 3px 0 0 3px; }
.cci-zone-hi { position: absolute; right: 0; width: 33.33%; height: 100%; background: rgba(239,83,80,.15); border-radius: 0 3px 3px 0; }
.cci-needle { position: absolute; top: -2px; width: 3px; height: 10px; border-radius: 2px; transform: translateX(-50%); transition: left .3s; }
/* mtf panel */
.mtf-panel { margin-top: 10px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; }
.mtf-title { font-size: 9px; font-weight: 800; color: var(--text-3); letter-spacing:.5px; text-transform: uppercase; margin-bottom: 6px; }
.mtf-grid { display: flex; gap: 6px; }
.mtf-row { flex: 1; background: var(--surface-3); border-radius: 6px; padding: 6px 8px; display: flex; flex-direction: column; gap: 4px; }
.mtf-label { font-size: 9px; font-weight: 800; color: var(--text-2); margin-bottom: 2px; }
.mtf-item { display: flex; align-items: center; justify-content: space-between; }
.mtf-k { font-size: 8px; color: var(--text-3); font-weight: 600; }
.mtf-v { font-size: 9px; font-weight: 800; font-family: var(--font-mono); }

/* ── Right Column ────────────────────────────────────────── */
.right-col { width: 354px; flex-shrink: 0; display: flex; flex-direction: column; overflow: hidden; }
.right-tabs { display: flex; flex-shrink: 0; padding: 8px 10px 0; gap: 0; border-bottom: 1px solid var(--border); }
.r-tab { flex: 1; padding: 6px 2px; border: none; background: transparent; color: var(--text-3); font-size: 11px; font-weight: 700; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: all .15s; font-family: inherit; white-space: nowrap; }
.r-tab:hover { color: var(--text-2); }
.r-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
.right-panel { flex: 1; overflow: hidden; display: flex; flex-direction: column; }

/* ── Sector Panel ────────────────────────────────────────── */
.sector-panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.sc-mkt-bar { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.sc-mkt-btns { display: flex; gap: 4px; }
.sc-mkt-btn { padding: 4px 12px; border: 1.5px solid var(--border-md); border-radius: 20px; background: transparent; color: var(--text-2); font-size: 11px; font-weight: 700; cursor: pointer; transition: all .15s; }
.sc-mkt-btn:hover { background: var(--surface-2); }
.sc-mkt-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.sc-breadth { font-size: 10px; font-weight: 700; display: flex; gap: 5px; align-items: center; }
.sc-scroll { flex: 1; overflow-y: auto; padding: 8px 10px 12px; }
.sc-section { margin-bottom: 12px; }
.sc-section-hdr { display: flex; align-items: center; gap: 5px; margin-bottom: 6px; font-size: 10px; font-weight: 800; color: var(--text-3); letter-spacing:.5px; text-transform: uppercase; }
.sc-section-arrow { color: var(--text-3); cursor: pointer; user-select: none; font-size: 10px; }
.sc-section-badge { margin-left: auto; font-size: 9px; font-weight: 700; color: var(--text-3); background: var(--surface-3); border-radius: 10px; padding: 1px 6px; }
.sc-idx-list { display: flex; flex-direction: column; gap: 3px; }
.sc-idx-row { display: flex; align-items: center; justify-content: space-between; padding: 5px 8px; background: var(--surface-2); border-radius: 8px; border-left: 3px solid transparent; }
.sc-idx-label { font-size: 9px; font-weight: 800; color: var(--text-3); letter-spacing:.3px; }
.sc-idx-name { font-size: 10px; font-weight: 600; }
.sc-idx-price { font-size: 12px; font-weight: 800; font-family: var(--font-mono); }
.sc-idx-pct { font-size: 10px; font-weight: 700; }
.sc-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
.sc-cell { padding: 6px 5px; border-radius: 8px; border: 1.5px solid transparent; cursor: pointer; transition: all .15s; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 1px; }
.sc-cell:hover { filter: brightness(1.08); transform: scale(1.02); }
.sc-cell-sel { border-color: var(--accent) !important; }
.sc-cell-label { font-size: 10px; font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; width: 100%; }
.sc-cell-name { font-size: 8px; color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; width: 100%; }
.sc-cell-pct { font-size: 11px; font-weight: 800; margin-top: 2px; font-family: var(--font-mono); }
.sc-rank-mini { margin-top: 8px; display: flex; flex-direction: column; gap: 3px; }
.sc-rank-mini-row { display: flex; align-items: center; gap: 6px; }
.sc-rank-mini-lbl { font-size: 9px; font-weight: 700; color: var(--text-2); width: 36px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex-shrink: 0; }
.sc-rank-mini-bar { flex: 1; height: 4px; background: var(--border-md); border-radius: 4px; overflow: hidden; }
.sc-rank-mini-fill { height: 100%; border-radius: 4px; transition: width .4s; }
.sc-rank-mini-val { font-size: 9px; font-weight: 700; width: 40px; text-align: right; flex-shrink: 0; font-family: var(--font-mono); }
.sc-themes { display: flex; flex-direction: column; gap: 10px; }
.sc-theme-name { font-size: 10px; font-weight: 800; color: var(--text-2); margin-bottom: 5px; }

.sc-chip { display: flex; align-items: center; gap: 3px; padding: 3px 8px; border-radius: 20px; cursor: pointer; transition: filter .15s; }

.sc-chip-pct { font-size: 9px; font-weight: 700; font-family: var(--font-mono); }

.screener-run-btn:disabled { opacity: .4; cursor: not-allowed; }

.screener-empty { text-align: center; color: var(--text-3); font-size: 12px; padding: 24px 0; line-height: 1.8; }
.screener-row { display: flex; align-items: flex-start; gap: 6px; padding: 8px 10px; border-radius: 10px; margin-bottom: 4px; background: var(--surface-2); border: 1px solid var(--border); cursor: pointer; transition: all .15s; }

.screener-row.bear { border-left: 3px solid var(--dn); }

.screener-name { font-size: 9px; color: var(--text-3); margin-top: 1px; }
.screener-row-center { flex: 1; display: flex; flex-wrap: wrap; gap: 3px; }
.screener-hit { font-size: 8px; font-weight: 700; padding: 2px 5px; border-radius: 5px; border: 1px solid; }
.screener-row-right { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
.screener-price { font-size: 10px; font-weight: 800; font-family: var(--font-mono); }

.ai-input-row { display: flex; gap: 6px; padding: 0 12px 10px; flex-shrink: 0; }

.ai-send-btn { padding: 8px 14px; border: var(--card-border); border-radius: 20px; background: var(--surface-2); color: var(--text-2); font-size: 12px; font-weight: 700; cursor: pointer; transition: all .2s; }
.ai-send-btn:hover { background: var(--surface); color: var(--text); transform: translateY(-1px); }

.news-item.news-bear { border-left-color: rgba(34,197,94,.35); }
.news-headline { display: block; font-size: 11.5px; font-weight: 600; color: var(--text); text-decoration: none; line-height: 1.55; margin-bottom: 5px; }
.news-meta { display: flex; align-items: center; justify-content: space-between; font-size: 10px; color: var(--text-3); }

.pf-header { padding: 12px 14px 10px; border-bottom: 1px solid var(--border); flex-shrink: 0; }

.pf-pnl { font-size: 12px; font-weight: 700; margin-top: 2px; }
.pf-empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; color: var(--text-3); gap: 6px; }

/* ── Utilities ───────────────────────────────────────────── */
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.up { color: var(--up); } .dn { color: var(--dn); }
.up-bg { background: var(--up-soft); } .dn-bg { background: var(--dn-soft); }
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-md); border-radius: 4px; }
::view-transition-old(root) { animation: 150ms ease-out both fade-vt; }
::view-transition-new(root) { animation: 300ms cubic-bezier(.16,1,.3,1) both springup-vt; }
@keyframes springup-vt { from { transform: translateY(10px); opacity: 0; } }
@keyframes fade-vt { to { opacity: 0; } }

;(function() {
  const techFor = (changePct) => {
    const up = changePct >= 0

    const rsiNum = parseFloat(rsi)
    const k = up ? (65 + changePct * 2).toFixed(1) : (35 + changePct * 1.5).toFixed(1)

    const bbWidth = (Math.abs(changePct) * 2 + 5).toFixed(1)
    const stochK = up ? (72 + changePct).toFixed(1) : (28 + changePct).toFixed(1)
    const stochD = up ? (60 + changePct).toFixed(1) : (38 + changePct).toFixed(1)
    const wr = up ? (-25).toFixed(1) : (-78).toFixed(1)
    const adx = (22 + Math.abs(changePct) * 2).toFixed(1)
    const plusDI = up ? (26 + changePct).toFixed(1) : (18).toFixed(1)
    const minusDI = up ? (16).toFixed(1) : (28 + Math.abs(changePct)).toFixed(1)
    const roc10 = (changePct * 1.5).toFixed(2)
    const roc21 = (changePct * 2.2).toFixed(2)
    const cci = up ? (82 + changePct * 5).toFixed(0) : (-90 + changePct * 5).toFixed(0)
    const cmf = (changePct * 0.05).toFixed(3)
    const mfi = up ? (62 + changePct).toFixed(1) : (38 + changePct).toFixed(1)
    const bullPower = (changePct * 0.3).toFixed(2)
    const bearPower = (changePct * -0.2).toFixed(2)
    const weeklyRsi = (rsiNum * 0.95).toFixed(1)
    const monthlyRsi = (rsiNum * 0.88).toFixed(1)

    const bbPatterns = { bull:'bull', bear:'bear', squeeze:'squeeze', neutral:'neutral' }
    const bbPattern = Math.abs(changePct) < 0.5 ? 'squeeze' : up ? 'bull' : 'bear'
    const bbSig = bbPattern === 'squeeze' ? 'BB 收縮 · 等待突破'
      : bbPattern === 'bull' ? (parseFloat(bbWidth) > 12 ? '騎乘上軌 · 偏多' : '突破上軌 · 偏多')
      : (parseFloat(bbWidth) > 12 ? '騎乘下軌 · 偏空' : '跌破下軌 · 偏空')

    const kdSig = up

      : (parseFloat(k) < 20 ? 'K<20 低檔鈍化 · 偏多' : '死叉 · K<D · 偏空')
    const macdSig = up
      ? (parseFloat(macd) > parseFloat(signal) ? '黃金交叉 · 偏多' : 'DIF 趨近 · 觀察')
      : (parseFloat(macd) < parseFloat(signal) ? '死亡交叉 · 偏空' : '整理中')
    const maStatus = up ? '多頭排列 · MA5>MA20' : '空頭排列 · MA5<MA20'
    const rsiSig = rsiNum >= 70 ? '超買區間 · 偏空'

      : rsiNum >= 55 ? '強勢偏多'

    const stochSig = parseFloat(stochK) >= 80 ? '超買 · 偏空'

    const mfiNum = parseFloat(mfi)

    const trend = up ? '上升趨勢' : '下降趨勢'
    const psarBull = up
    const psarSig = up ? 'SAR 在價下方 · 多頭確認' : 'SAR 在價上方 · 空頭確認'
    const obvTrend = up ? (changePct > 2 ? 'confirm-up' : 'diverge-up') : (changePct < -2 ? 'confirm-dn' : 'diverge-dn')
    const atr = (parseFloat(atrPct) * 8).toFixed(2)
    const volatility = parseFloat(atrPct) > 3 ? '高波動' : parseFloat(atrPct) > 1.5 ? '中波動' : '低波動'

    const candlePatterns = [
      { name:'大陽線 · 強勢上漲', bull: true,  hint:'收盤接近當日最高，多方力道強勁' },
      { name:'十字星 · 多空拉鋸', bull: null,  hint:'開收盤接近，待方向確認' },

      { name:'射擊之星 · 頂部警示', bull: false, hint:'上影線長，高位賣壓出現' },
    ]
    const cpIdx = up ? (Math.abs(changePct) > 2 ? 0 : 3) : (Math.abs(changePct) > 2 ? 2 : 4)
    const candlePattern = changePct === 0 ? candlePatterns[1] : candlePatterns[cpIdx]

    const rsiDivergence = Math.abs(changePct) > 3 ? {
      bull: !up,
      desc: up ? '價格創新高但 RSI 未同步 · 潛在頂背離' : '價格創新低但 RSI 未同步 · 潛在底背離'
    } : null

    const ma5val = 100 + changePct * 0.5
    const ma20val = 100 + changePct * 0.3

    return {
      trend, kdSignal:kdSig, macdSignal:macdSig, maStatus,
      lastK:k, lastD:d, lastMacd:macd, lastSignal:signal,
      ma5: ma5val.toFixed(2), ma20: ma20val.toFixed(2),

      lastMfi: mfi, mfiSignal:mfiSig,
      obvTrend,
      stochRsiK: stochK, stochRsiD: stochD, stochRsiSignal:stochSig,
      williamsR: wr, wrSignal:wrSig,
      bbWidth, bbSqueezeSignal:bbSig, bbPattern,
      psarBull, psarSignal:psarSig,
      adx, plusDI, minusDI, adxSignal:adxSig,
      roc10, roc21, rocSignal:rocSig,
      rsiDivergence,
      cci20: cci, cciSignal:cciSig,
      cmf20: cmf, cmfSignal:cmfSig,
      bullPower, bearPower, elderSignal:elderSig,
      weeklyRsi, monthlyRsi,
      weeklyMacd: up ? '多' : '空',
    }
  }
  const techBySymbol = {}
  Object.values(window.MW_DATA.quotes).flat().forEach(q => {
    techBySymbol[q.symbol] = techFor(q.changePct)
  })
  window.MW_TECH = techBySymbol
  window.MW_TECH_FOR = (sym) => window.MW_TECH[sym] || techFor(0)
})()

<script type="text/babel">
/* ── mw-components.jsx ──────────────────────────────────── */
const { useState, useEffect, useRef, useMemo, useCallback } = React

/* ── Live Quotes via Yahoo Finance + corsproxy.io ─────────── */
const CORS_PROXY = 'https://corsproxy.io/?'

async function fetchYahooBatch(symbols) {
  const joined = symbols.join(',')
  const baseUrl = `https://query1.finance.yahoo.com/v7/finance/quote?symbols=${encodeURIComponent(joined)}&fields=regularMarketPrice,regularMarketChange,regularMarketChangePercent,regularMarketVolume`
  const proxyUrl = CORS_PROXY + encodeURIComponent(baseUrl)
  const res = await fetch(proxyUrl)
  if (!res.ok) throw new Error(`Yahoo ${res.status}`)
  const json = await res.json()
  return json?.quoteResponse?.result ?? []
}

function buildTickerFromQuotes(quotes) {
  const fmt = (q) => ({
    label: q.name,
    price: q.price >= 10000 ? Math.round(q.price).toLocaleString('en-US')
         : q.price >= 1000  ? q.price.toLocaleString('en-US', {minimumFractionDigits:0,maximumFractionDigits:0})
         : q.price.toFixed(2),
    pct: (q.changePct >= 0 ? '+' : '') + q.changePct.toFixed(2) + '%',
    up: q.changePct >= 0,
  })
  const flat = Object.values(quotes).flat()
  const pick = (sym) => flat.find(q => q.symbol === sym)
  const syms = ['^TWII','2330.TW','^GSPC','^IXIC','NVDA','BTC-USD','2603.TW','^VIX']
  return syms.map(s => pick(s)).filter(Boolean).map(fmt)
}

function useLiveQuotes() {
  const [quotes, setQuotes] = useState(() => ({ ...window.MW_DATA.quotes }))
  const [lastUpdate, setLastUpdate] = useState(null)
  const [liveError, setLiveError] = useState(null)
  const [liveLoading, setLiveLoading] = useState(false)

  const allSymbols = useMemo(
    () => Object.values(window.MW_DATA.quotes).flat().map(q => q.symbol),
    []
  )

  const fetchAll = useCallback(async () => {
    setLiveLoading(true)
    setLiveError(null)
    try {
      const results = await fetchYahooBatch(allSymbols)
      if (!results.length) return

      const bySymbol = {}
      results.forEach(r => {
        bySymbol[r.symbol] = {
          price:     r.regularMarketPrice ?? 0,
          change:    r.regularMarketChange ?? 0,
          changePct: r.regularMarketChangePercent ?? 0,
          volume:    r.regularMarketVolume ?? 0,
        }
      })

      const updated = {}
      Object.entries(window.MW_DATA.quotes).forEach(([cat, items]) => {
        updated[cat] = items.map(item => {
          const live = bySymbol[item.symbol]
          return live ? { ...item, ...live } : item
        })
      })

      Object.assign(window.MW_DATA.quotes, updated)
      setQuotes({ ...updated })
      setLastUpdate(new Date())
    } catch (e) {
      setLiveError(e.message)
    } finally {
      setLiveLoading(false)
    }
  }, [allSymbols])

  useEffect(() => {
    fetchAll()
    const tid = window.setInterval(fetchAll, 30000)
    return () => window.clearInterval(tid)
  }, [fetchAll])

  return { quotes, lastUpdate, liveError, liveLoading }
}

function MiniSparkline({ data, up, width = 64, height = 30 }) {
  if (!data || data.length < 2) return <svg width={width} height={height} />
  const P = 3, min = Math.min(...data), max = Math.max(...data), rng = max - min || 1
  const pts = data.map((v, i) => [P + (i/(data.length-1))*(width-P*2), P + (1-(v-min)/rng)*(height-P*2)])
  const line = pts.map(p => p.join(',')).join(' ')
  const area = `M${pts[0][0]},${height} ${pts.map(p=>`L${p[0]},${p[1]}`).join(' ')} L${pts[pts.length-1][0]},${height}Z`
  const col = up ? 'var(--up)' : 'var(--dn)'
  const fill = up ? 'rgba(239,68,68,.13)' : 'rgba(34,197,94,.13)'
  const [lx, ly] = pts[pts.length-1]
  return (
    <svg width={width} height={height} style={{display:'block',flexShrink:0}}>
      <path d={area} fill={fill} />
      <polyline points={line} fill="none" stroke={col} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" />
      <circle cx={lx} cy={ly} r="2.2" fill={col} />
    </svg>
  )
}

function SessionClock() {
  const [now, setNow] = useState(new Date())
  useEffect(() => { const id = setInterval(() => setNow(new Date()), 1000); return () => clearInterval(id) }, [])
  const utcH = now.getUTCHours(), utcM = now.getUTCMinutes()
  const isDST = (now.getUTCMonth()+1) >= 3 && (now.getUTCMonth()+1) <= 11
  const etH = (utcH - (isDST ? 4 : 5) + 24) % 24
  const etTotal = etH*60 + utcM
  const isWknd = [0,6].includes(now.getUTCDay())
  const session = isWknd ? '休市' : etTotal>=570&&etTotal<960 ? '正盤' : etTotal>=240&&etTotal<570 ? '盤前' : etTotal>=960&&etTotal<1200 ? '盤後' : '閉市'
  const sCol = session==='正盤' ? 'var(--dn)' : (session==='盤前'||session==='盤後') ? 'var(--warn)' : 'var(--text-3)'
  const twH = (utcH*60+utcM+480) % 1440
  const twOpen = !isWknd && twH>=540 && twH<810
  return (
    <div className="session-clock">
      <div className="session-item">
        <span className="session-dot" style={{background:sCol}} />
        <span className="session-label">US</span>
        <span className="session-status" style={{color:sCol}}>{session}</span>

      <div className="session-divider" />
      <div className="session-item">
        <span className="session-dot" style={{background:twOpen?'var(--dn)':'var(--text-3)'}} />

      <span className="session-time mono">{String(etH).padStart(2,'0')}:{String(utcM).padStart(2,'0')} ET</span>

  )
}

function CandleChart({ candles }) {
  const W = 800, H = 260, PRICE_H = 195, VOL_TOP = 215, VOL_H = 40, PAD = 6
  const n = candles.length
  if (n < 2) return null
  const prices = candles.flatMap(c => [c.high, c.low])
  const pMin = Math.min(...prices), pMax = Math.max(...prices), pRng = pMax - pMin || 1
  const volMax = Math.max(...candles.map(c => c.volume))
  const cW = (W / n) * 0.52
  const py = p => PAD + (1 - (p - pMin) / pRng) * (PRICE_H - PAD * 2)
  const px = i => (i + 0.5) * (W / n)
  const ma20 = candles.map((_, i) => { if (i < 19) return null; return candles.slice(i-19, i+1).reduce((s, c) => s + c.close, 0) / 20 })
  const ma20pts = ma20.map((v, i) => v != null ? `${px(i)},${py(v)}` : null).filter(Boolean).join(' ')
  const ma5 = candles.map((_, i) => { if (i < 4) return null; return candles.slice(i-4, i+1).reduce((s, c) => s + c.close, 0) / 5 })
  const ma5pts = ma5.map((v, i) => v != null ? `${px(i)},${py(v)}` : null).filter(Boolean).join(' ')
  const gridPrices = [0, 0.25, 0.5, 0.75, 1].map(t => pMin + pRng * t)
  return (
    <svg viewBox={`0 0 ${W} ${H}`} width="100%" height="100%" style={{display:'block'}}>
      {gridPrices.map((p, i) => (<line key={i} x1={0} y1={py(p)} x2={W} y2={py(p)} stroke="var(--border)" strokeWidth="0.5" />))}
      {gridPrices.filter((_, i) => i > 0 && i < 4).map((p, i) => (<text key={i} x={W - 2} y={py(p) - 3} fontSize="9" fill="var(--text-3)" textAnchor="end" fontFamily="var(--font-mono)">{p.toFixed(0)}</text>))}
      {ma20pts && <polyline points={ma20pts} fill="none" stroke="rgba(245,158,11,0.75)" strokeWidth="1.2" strokeLinecap="round" />}
      {ma5pts && <polyline points={ma5pts} fill="none" stroke="rgba(99,102,241,0.65)" strokeWidth="1.2" strokeLinecap="round" />}
      {candles.map((c, i) => {
        const up = c.close >= c.open
        const col = up ? 'var(--up)' : 'var(--dn)'
        const x = px(i)
        const bodyTop = py(Math.max(c.open, c.close))
        const bodyBot = py(Math.min(c.open, c.close))
        const bodyH = Math.max(1, bodyBot - bodyTop)
        const vH = (c.volume / volMax) * VOL_H
        return (
          <g key={i}>
            <rect x={x - cW/2} y={VOL_TOP + VOL_H - vH} width={cW} height={vH} fill={up ? 'rgba(239,68,68,.22)' : 'rgba(34,197,94,.22)'} />
            <line x1={x} y1={py(c.high)} x2={x} y2={py(c.low)} stroke={col} strokeWidth="1" />
            <rect x={x - cW/2} y={bodyTop} width={cW} height={bodyH} fill={up ? col : 'none'} stroke={col} strokeWidth="1" />
          </g>
        )
      })}
      <rect x={8} y={H - 14} width={6} height={6} rx={1} fill="rgba(245,158,11,0.75)" />
      <text x={17} y={H - 7} fontSize="8.5" fill="var(--text-3)" fontFamily="var(--font-mono)">MA20</text>
      <rect x={48} y={H - 14} width={6} height={6} rx={1} fill="rgba(99,102,241,0.65)" />
      <text x={57} y={H - 7} fontSize="8.5" fill="var(--text-3)" fontFamily="var(--font-mono)">MA5</text>
    </svg>
  )
}

/* ── CompositeScore ── */
function CompositeScore({ tech }) {
  const { kdSignal, macdSignal, maStatus, lastRsi, trend, candlePattern, psarBull, stochRsiK, williamsR, roc10, rsiDivergence } = tech
  let score = 0
  if (/偏多|金叉/.test(kdSignal)) score += 15; else if (/偏空|死叉/.test(kdSignal)) score -= 15
  if (/黃金交叉/.test(macdSignal)) score += 20; else if (/死亡交叉/.test(macdSignal)) score -= 20
  if (/多頭/.test(maStatus)) score += 15; else if (/空頭/.test(maStatus)) score -= 15
  const rsiNum = parseFloat(lastRsi) || 50
  if (rsiNum > 55 && rsiNum < 70) score += 10; else if (rsiNum < 45 && rsiNum > 30) score -= 10
  if (/上升/.test(trend)) score += 10; else score -= 10
  if (candlePattern?.bull === true) score += 8; else if (candlePattern?.bull === false) score -= 8
  if (psarBull === true) score += 7; else if (psarBull === false) score -= 7
  const stK = parseFloat(stochRsiK) || 50
  if (stK < 20) score += 6; else if (stK > 80) score -= 6
  const wr = parseFloat(williamsR) || -50
  if (wr <= -80) score += 5; else if (wr >= -20) score -= 5
  const roc = parseFloat(roc10) || 0
  if (roc >= 3) score += 4; else if (roc <= -3) score -= 4
  if (rsiDivergence?.bull === true) score += 10; else if (rsiDivergence?.bull === false) score -= 10
  const clamped = Math.max(-100, Math.min(100, score))
  const pct = ((clamped + 100) / 200) * 100
  const color = clamped > 30 ? 'var(--up)' : clamped < -30 ? 'var(--dn)' : 'var(--warn)'
  const label = clamped > 55 ? '強烈看多' : clamped > 20 ? '偏多' : clamped < -55 ? '強烈看空' : clamped < -20 ? '偏空' : '中性觀望'
  return (
    <div className="composite-score">
      <div className="cs-left">
        <div className="cs-label">綜合訊號</div>
        <div className="cs-value" style={{color}}>{label}</div>
      </div>
      <div className="cs-bar-wrap">
        <div className="cs-bar-track">
          <div className="cs-bar-fill" style={{width:`${pct}%`,background:`linear-gradient(90deg,var(--dn) 0%,var(--warn) 50%,var(--up) 100%)`}} />
          <div className="cs-needle" style={{left:`${pct}%`}} />
        </div>
        <div className="cs-ticks"><span>空</span><span>中</span><span>多</span></div>
      </div>
      <div className="cs-score mono" style={{color}}>{clamped > 0 ? '+' : ''}{clamped}</div>
    </div>
  )
}

              <div className="bb-bw-fill" style={{width:`${Math.min(bbV/25,1)*100}%`,background:bbMeta.color}} />

        <SigCard label="均線 MA" sig={maStatus}>

        <SigCard label="動能 ROC" sig={rocSignal}>
          <div className="bar-row"><span className="bar-lbl" style={{fontSize:8}}>10D</span><span className="bar-val mono" style={{color:parseFloat(roc10)>=0?'var(--up)':'var(--dn)'}}>{parseFloat(roc10)>=0?'+':''}{roc10}%</span></div>
          <div className="bar-row"><span className="bar-lbl" style={{fontSize:8}}>21D</span><span className="bar-val mono" style={{color:parseFloat(roc21)>=0?'var(--up)':'var(--dn)'}}>{parseFloat(roc21)>=0?'+':''}{roc21}%</span></div>
        </SigCard>

        <SigCard label="CCI(20)" sig={cciSignal}>
          {(() => {
            const v = parseFloat(cci20) || 0
            const pct = Math.min(Math.max((v+300)/600*100,0),100)
            const color = v > 100 ? 'var(--dn)' : v < -100 ? 'var(--up)' : v > 0 ? 'rgba(38,166,154,.8)' : 'rgba(239,83,80,.8)'
            return (
              <>
                <div className="bar-row">
                  <span className="bar-lbl">CCI</span>
                  <div className="cci-track">
                    <div className="cci-zone-lo" /><div className="cci-zone-hi" />

                  </div>
                  <span className="bar-val mono" style={{color}}>{v>=0?'+':''}{cci20}</span>
                </div>
                <div style={{display:'flex',justifyContent:'space-between',fontSize:7.5,color:'var(--text-3)',marginTop:2}}>
                  <span style={{color:'var(--up)'}}>-300</span><span>-100</span><span>0</span><span>+100</span><span style={{color:'var(--dn)'}}>+300</span>
                </div>
              </>
            )
          })()}
        </SigCard>

        <SigCard label="CMF(20) 柴金資金流" sig={cmfSignal}>
          {(() => {
            const v = parseFloat(cmf20) || 0
            const color = v > 0.1 ? 'var(--up)' : v < -0.1 ? 'var(--dn)' : 'var(--text-2)'
            return (
              <div className="bar-row">
                <span className="bar-lbl">CMF</span>
                <div className="macd-track">
                  <div className="macd-mid" />
                  <div className="macd-bar" style={{width:`${Math.min(Math.abs(v)/0.5,1)*50}%`,left:v>=0?'50%':`calc(50% - ${Math.min(Math.abs(v)/0.5,1)*50}%)`,background:v>=0?'var(--up)':'var(--dn)'}} />
                </div>
                <span className="bar-val mono" style={{color}}>{v>=0?'+':''}{cmf20}</span>
              </div>
            )
          })()}
        </SigCard>

        <SigCard label="Elder Ray 多空力道" sig={elderSignal}>
          {(() => {
            const bv = parseFloat(bullPower)||0, brv = parseFloat(bearPower)||0
            const ext = Math.max(Math.abs(bv),Math.abs(brv),0.1)
            const bPct = Math.min(Math.abs(bv)/ext,1)*50, brPct = Math.min(Math.abs(brv)/ext,1)*50
            return (
              <>
                <div className="bar-row">
                  <span className="bar-lbl" style={{color:'var(--up)',fontSize:8}}>牛力</span>
                  <div className="macd-track"><div className="macd-mid" /><div className="macd-bar" style={{width:`${bPct}%`,left:bv>=0?'50%':`calc(50% - ${bPct}%)`,background:bv>=0?'var(--up)':'var(--dn)'}} /></div>
                  <span className="bar-val mono" style={{color:bv>=0?'var(--up)':'var(--dn)'}}>{bv>=0?'+':''}{bullPower}</span>
                </div>
                <div className="bar-row">
                  <span className="bar-lbl" style={{color:'var(--dn)',fontSize:8}}>熊力</span>
                  <div className="macd-track"><div className="macd-mid" /><div className="macd-bar" style={{width:`${brPct}%`,left:brv>=0?'50%':`calc(50% - ${brPct}%)`,background:brv>=0?'var(--up)':'var(--dn)'}} /></div>
                  <span className="bar-val mono" style={{color:brv>=0?'var(--up)':'var(--dn)'}}>{brv>=0?'+':''}{bearPower}</span>
                </div>
              </>
            )
          })()}
        </SigCard>

        {rsiDivergence && (
          <div className={`sig-card ${rsiDivergence.bull?'bull':'bear'}`} style={{gridColumn:'span 2'}}>
            <div className="sig-top">
              <div className={`sig-geo ${rsiDivergence.bull?'bull':'bear'}`} style={{fontSize:16}}>{rsiDivergence.bull?'🔵':'🔴'}</div>
              <div className="sig-body"><div className="tech-label">RSI 背離訊號</div><div className={`tech-sig ${rsiDivergence.bull?'up':'dn'}`}>{rsiDivergence.desc}</div></div>
            </div>
            <div className="sig-bars">
              <div style={{fontSize:10,color:'var(--text-3)',lineHeight:1.5}}>
                {rsiDivergence.bull ? '價格創新低但 RSI 未同步，潛在多頭反轉訊號，建議搭配其他指標確認' : '價格創新高但 RSI 未同步，潛在空頭回落訊號，建議設定止損保護獲利'}
              </div>
            </div>
          </div>
        )}
      </div>

      {(weeklyRsi || monthlyRsi) && (
        <div className="mtf-panel">
          <div className="mtf-title">多週期分析</div>
          <div className="mtf-grid">
            {[
              { label:'日線', rsi: lastRsi, macd: parseFloat(lastMacd) > parseFloat(lastSignal) ? '多' : '空' },
              { label:'週線', rsi: weeklyRsi, macd: weeklyMacd },
              { label:'月線', rsi: monthlyRsi, macd: null },
            ].filter(row => row.rsi).map(row => {
              const rv = parseFloat(row.rsi) || 50
              const rsiColor = rv >= 70 ? 'var(--dn)' : rv <= 30 ? 'var(--up)' : rv >= 55 ? 'rgba(38,166,154,.8)' : rv <= 45 ? 'rgba(239,83,80,.8)' : 'var(--text-2)'
              return (
                <div key={row.label} className="mtf-row">
                  <span className="mtf-label">{row.label}</span>
                  <span className="mtf-item"><span className="mtf-k">RSI</span><span className="mtf-v mono" style={{color:rsiColor}}>{row.rsi}</span></span>
                  {row.macd && <span className="mtf-item"><span className="mtf-k">MACD</span><span className={`mtf-v ${row.macd==='多'?'up':'dn'}`}>{row.macd}</span></span>}
                </div>
              )
            })}
          </div>
        </div>
      )}
    </div>
  )
}

function ScreenerPanel({ onSelect }) {
  const [sel, setSel] = useState(['rsi_oversold','macd_golden','kd_golden'])
  const [hasScanned, setHasScanned] = useState(false)
  const [loading, setLoading] = useState(false)
  const [progress, setProgress] = useState(0)
  const [range, setRange] = useState('3mo')
  const runScan = () => {
    setLoading(true); setHasScanned(false); setProgress(0)
    let p = 0
    const id = setInterval(() => {
      p += Math.random() * 18; setProgress(Math.min(p, 95))
      if (p >= 95) { clearInterval(id); setLoading(false); setHasScanned(true); setProgress(100) }
    }, 120)
  }
  const results = hasScanned ? window.MW_DATA.screener.filter(r => r.hits.some(h => sel.includes(h))) : []
  return (
    <div className="screener-panel">
      <div className="screener-header">
        <div className="screener-title">選股篩選器</div>
        <div style={{display:'flex',gap:4}}>
          {['1mo','3mo','6mo'].map(r => (<button key={r} className={`range-tab ${range===r?'active':''}`} onClick={() => setRange(r)}>{r}</button>))}
        </div>
      </div>
      <div className="screener-presets">
        {PRESETS.map(p => (<button key={p.label} className="screener-preset-btn" onClick={() => setSel(p.criteria)}>{p.label}</button>))}
      </div>
      <div className="screener-criteria">
        {CRITERIA.map(c => (
          <button key={c.id} className={`screener-crit-btn ${sel.includes(c.id)?'active':''}`}
            style={sel.includes(c.id) ? {borderColor:c.col, color:c.col, background:'transparent'} : {}}
            onClick={() => setSel(v => v.includes(c.id) ? v.filter(x=>x!==c.id) : [...v,c.id])}
          >{c.label}</button>
        ))}
      </div>
      <button className="screener-run-btn" onClick={runScan} disabled={loading || sel.length === 0}>
        {loading ? `掃描中 ${Math.round(progress)}%…` : '▶ 開始掃描'}
      </button>
      {loading && <div className="screener-loading-bar"><div className="screener-loading-fill" style={{width:`${progress}%`}} /></div>}
      {hasScanned && !loading && <div className="screener-results-header">找到 {results.length} 個符合標的</div>}
      <div className="screener-results">
        {hasScanned && !loading && results.length === 0 && <div className="screener-empty">無符合條件標的<br /><span style={{fontSize:11}}>嘗試調整篩選條件</span></div>}
        {results.map(r => {
          const bullHits = r.hits.filter(id => CRITERIA.find(c=>c.id===id)?.col==='var(--up)').length
          const bearHits = r.hits.filter(id => CRITERIA.find(c=>c.id===id)?.col==='var(--dn)').length
          const sig = bullHits > bearHits ? 'bull' : bearHits > bullHits ? 'bear' : 'neutral'
          return (
            <div key={r.symbol} className={`screener-row ${sig}`} onClick={() => onSelect && onSelect(r.symbol)}>
              <div className="screener-row-left">
                <div className="screener-sym mono">{r.symbol}</div>
                <div className="screener-name">{r.name}</div>
              </div>
              <div className="screener-row-center">
                {r.hits.filter(id => sel.includes(id)).map(id => {
                  const c = CRITERIA.find(x => x.id===id)
                  return c ? <span key={id} className="screener-hit" style={{color:c.col,borderColor:c.col}}>{c.label}</span> : null
                })}
              </div>
              <div className="screener-row-right">
                <span className={`screener-price ${r.changePct>=0?'up':'dn'}`}>{r.price.toFixed(2)} <span style={{fontSize:9}}>{r.changePct>=0?'▲':'▼'}{Math.abs(r.changePct).toFixed(2)}%</span></span>
                <span className={`screener-score ${sig}`}>{r.hits.length}</span>
              </div>
            </div>
          )
        })}
      </div>
    </div>
  )
}

function AIPanel({ symbol }) {
  const [msgs, setMsgs] = useState([{ role:'ai', text:`您好！我是 AI 投資顧問。\n\n目前已載入 ${symbol} 的技術分析數據。請問有什麼想分析的？` }])
  const [input, setInput] = useState('')
  const send = (txt) => {
    const userMsg = (txt || input).trim()
    if (!userMsg) return
    setInput('')
    setMsgs(v => [...v, {role:'user', text:userMsg}, {role:'ai', text:'…', typing:true}])
    setTimeout(() => {
      setMsgs(v => v.map((m, i) => i===v.length-1 ? {role:'ai', text:`根據 ${symbol} 近期技術走勢分析：\n\nMACD 出現黃金交叉，短期動能偏強；RSI 維持在 55 附近，未進入超買區間。\n\n建議：持有，設停損在近期低點下方 3%。\n\n※ 本內容僅供參考，非投資建議`} : m))
    }, 1200)
  }
  const quickPrompts = ['📈 技術分析', '🛡 風險評估', '⚖️ 多空訊號', '🎯 進出場點']
  return (
    <div className="ai-panel">
      <div className="ai-messages scroll-soft">
        {msgs.map((m, i) => (
          <div key={i} className={`ai-msg ${m.role}`}>
            <div className="msg-role">{m.role==='user'?'你':'AI 顧問'}</div>
            <div className="msg-text">{m.text==='…' ? <span style={{letterSpacing:4}}>···</span> : m.text}</div>
          </div>
        ))}
      </div>
      <div className="ai-actions">
        <button className="analyze-btn" onClick={() => send(`全面分析 ${symbol}`)}>全面分析 {symbol}</button>
        <div style={{display:'flex',flexWrap:'wrap',gap:4}}>
          {quickPrompts.map(p => (<button key={p} className="quick-chip" onClick={() => send(p)}>{p}</button>))}
        </div>
      </div>
      <div className="ai-input-row">
        <input className="ai-input" placeholder="輸入問題…" value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==='Enter'&&send()} />
        <button className="ai-send-btn" onClick={() => send()}>送出</button>
      </div>
    </div>
  )
}

const TABS = [
  { id:'sector',    label:'板塊' },
  { id:'screener',  label:'選股' },
  { id:'ai',        label:'AI' },
  { id:'portfolio', label:'持倉' },
  { id:'news',      label:'新聞' },
  { id:'alert',     label:'警示' },
]

function AlertPanel() {
  return (
    <div style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:8,color:'var(--text-3)'}}>
      <span style={{fontSize:28}}>🔔</span>
      <span style={{fontSize:13,fontWeight:600}}>警示管理</span>
      <span style={{fontSize:11}}>設定目標價與停損</span>
    </div>
  )
}

function App() {
  const saved = localStorage.getItem('mw-dark')
  const [dark, setDark] = useState(saved === '1')
  const [selected, setSelected] = useState('2330.TW')
  const [rightTab, setRightTab] = useState('sector')

  const { quotes, lastUpdate, liveError, liveLoading } = useLiveQuotes()
  const ticker = useMemo(() => buildTickerFromQuotes(quotes), [quotes])

  useEffect(() => {
    document.documentElement.setAttribute('data-appearance', dark ? 'dark' : 'light')
    localStorage.setItem('mw-dark', dark ? '1' : '0')
  }, [dark])

  const handleTabChange = (tab) => {
    if (document.startViewTransition) {
      document.startViewTransition(() => setRightTab(tab))
    } else {
      setRightTab(tab)
    }
  }

  return (
    <div className={`app${dark?' dark':''}`}>
      <NavBar dark={dark} onToggleDark={() => setDark(d => !d)} liveLoading={liveLoading} liveError={liveError} lastUpdate={lastUpdate} />
      <MarketTicker ticker={ticker} />
      <div className="main-layout">
        <WatchList selected={selected} onSelect={setSelected} quotes={quotes} />
        <div className="center-col">
          <ChartPanel symbol={selected} />
          <TechSignals symbol={selected} />
        </div>
        <div className="right-col glass-card">
          <div className="right-tabs">
            {TABS.map(t => (<button key={t.id} className={`r-tab ${rightTab===t.id?'active':''}`} onClick={() => handleTabChange(t.id)}>{t.label}</button>))}
          </div>
          <div className="right-panel">
            {rightTab === 'sector'    && <SectorPanel    onSelect={setSelected} />}
            {rightTab === 'screener'  && <ScreenerPanel  onSelect={setSelected} />}
            {rightTab === 'ai'        && <AIPanel        symbol={selected} />}
            {rightTab === 'portfolio' && <PortfolioPanel />}
            {rightTab === 'news'      && <NewsPanel />}
            {rightTab === 'alert'     && <AlertPanel />}
          </div>
        </div>
      </div>
    </div>
  )
}

ReactDOM.createRoot(document.getElementById('app')).render(<App />)
</script>
</body>
